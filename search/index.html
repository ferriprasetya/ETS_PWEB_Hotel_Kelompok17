<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Hotels - NgamarIn</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-transparent fixed-top w-100 z-50 pt-3"
    >
      <div class="container glass-panel rounded-pill px-4 py-2">
        <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/index.html">
          <div
            class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
            style="width: 32px; height: 32px"
          >
            <i class="bi bi-building"></i>
          </div>
          NgamarIn
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item mx-2">
              <a class="nav-link text-dark-emphasis" href="/index.html">Home</a>
            </li>
            <li class="nav-item mx-2">
              <a class="nav-link text-dark-emphasis" href="/search/index.html">Hotels</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <a
        class="back-button back-button-inline"
        href="javascript:history.back()"
        aria-label="Back to previous page"
      >
        <i class="bi bi-arrow-left"></i>
        Back
      </a>
    </div>

    <!-- Content -->
    <main class="container py-5">
      <div class="row">
        <!-- Header for List/Grid and Sorting -->
        <div
          class="col-12 mb-4 d-flex flex-wrap gap-3 justify-content-between align-items-end border-bottom pb-3"
        >
          <div>
            <h2 class="fw-bold mb-2">Explore <span id="resultsCount">...</span> Places</h2>
            <div class="d-flex align-items-center flex-wrap gap-3">
              <button
                class="btn btn-outline-primary btn-sm rounded-pill fw-semibold"
                id="btnToggleBookmarks"
              >
                <i class="bi bi-bookmark me-1"></i>
                <span class="bookmarks-text">Show Bookmarked</span>
              </button>
              <div class="d-flex align-items-center">
                <span class="me-2 text-dark-emphasis small">Sort by:</span>
                <select
                  id="filterSort"
                  class="form-select form-select-sm d-inline-block w-auto border-0 bg-light fw-semibold pe-5"
                >
                  <option value="rating">Top Reviewed</option>
                  <option value="lowest_price">Lowest Price</option>
                </select>
              </div>
            </div>
          </div>
          <div
            class="btn-group border rounded-pill p-1 bg-white shadow-sm view-toggle-group"
            role="group"
          >
            <button
              type="button"
              class="btn btn-sm text-secondary rounded-pill active px-3"
              id="btnListView"
              title="List View"
            >
              <i class="bi bi-list-ul"></i>
            </button>
            <button
              type="button"
              class="btn btn-sm text-secondary rounded-pill px-3"
              id="btnGridView"
              title="Grid View"
            >
              <i class="bi bi-grid"></i>
            </button>
          </div>
        </div>

        <!-- Hotels List Container -->
        <section class="col-12">
          <div class="row g-4" id="searchResultsContainer">
            <!-- Data will be injected here via app.js -->
            <div class="col-12 text-center text-muted" id="searchLoading">
              <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 NgamarIn. All rights reserved.</p>
      </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Detail - NgamarIn</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-light bg-transparent fixed-top w-100 z-50 pt-3"
    >
      <div class="container glass-panel rounded-pill px-4 py-2">
        <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/index.html">
          <div
            class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
            style="width: 32px; height: 32px"
          >
            <i class="bi bi-building"></i>
          </div>
          NgamarIn
        </a>
        <button
          class="navbar-toggler border-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item mx-2">
              <a class="nav-link text-dark-emphasis" href="/index.html">Home</a>
            </li>
            <li class="nav-item mx-2">
              <a class="nav-link text-dark-emphasis" href="/search/index.html">Hotels</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <a
        class="back-button back-button-inline"
        href="javascript:history.back()"
        aria-label="Back to previous page"
      >
        <i class="bi bi-arrow-left"></i>
        Back
      </a>
    </div>

    <!-- Main Detail Content -->
    <main class="container py-5" id="hotelDetailContainer">
      <div class="col-12 text-center text-muted" id="detailLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Fetching hotel details...</p>
      </div>
      <!-- Injected via app.js -->
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center">
        <p class="mb-0">&copy; 2026 NgamarIn. All rights reserved.</p>
      </div>
    </footer>

    <!-- Booking Modal -->
    <div
      class="modal fade"
      id="bookingModal"
      tabindex="-1"
      aria-labelledby="bookingModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title fw-bold" id="bookingModalLabel">Complete Your Booking</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <div class="alert alert-info py-2" role="alert">
              <small class="fw-semibold"
                >Hotel: <span id="modalHotelName" class="fw-bold"></span></small
              ><br />
              <small class="fw-semibold"
                >Room: <span id="modalRoomType" class="fw-bold"></span></small
              ><br />
              <small class="fw-semibold"
                >Price/Night: Rp. <span id="modalRoomPrice" class="fw-bold"></span
              ></small>
            </div>
            <form id="bookingForm">
              <input type="hidden" id="hiddenHotelId" />
              <input type="hidden" id="hiddenRoomId" />
              <div class="mb-3">
                <label for="guestName" class="form-label fw-semibold">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="guestName"
                  required
                  placeholder="John Doe"
                />
              </div>
              <div class="mb-3">
                <label for="guestEmail" class="form-label fw-semibold">Email address</label>
                <input
                  type="email"
                  class="form-control"
                  id="guestEmail"
                  required
                  placeholder="john@example.com"
                />
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="checkInDate" class="form-label fw-semibold">Check-In</label>
                  <input type="date" class="form-control" id="checkInDate" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="checkOutDate" class="form-label fw-semibold">Check-Out</label>
                  <input type="date" class="form-control" id="checkOutDate" required />
                </div>
              </div>
              <div class="d-grid mt-4">
                <button type="submit" class="btn btn-primary fw-bold py-2">Confirm Booking</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Success Toast Notification -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="bookingToast"
        class="toast align-items-center text-bg-success border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body fw-semibold">
            Booking confirmed! Thank you for choosing NgamarIn.
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
